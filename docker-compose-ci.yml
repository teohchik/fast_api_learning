 services:
  expenses_back_service:
    container_name: 'expenses_back'
    image: expenses-api-image:latest
    networks:
      - myNetwork

  expenses_celery_worker_service:
    container_name: 'expenses_celery_worker'
    image: expenses-api-image:latest
    networks:
      - myNetwork
    command: "celery --app=src.tasks.celery_app:celery_inst worker -l INFO"

  expenses_celery_beat_service:
    container_name: 'expenses_celery_beat'
    image: expenses-api-image:latest
    networks:
      - myNetwork
    command: "celery --app=src.tasks.celery_app:celery_inst beat -l INFO"

networks:
  myNetwork:
    external: true